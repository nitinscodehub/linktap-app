name: one_tap_links
description: "OneTap Links - Quick access bookmark manager app"
publish_to: 'Nitin'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  url_launcher: ^6.2.4
  shared_preferences: ^2.2.2
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1   # 👈 ADD THIS

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png   # 👈 ADD THIS (important)

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
